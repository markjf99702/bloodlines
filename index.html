<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bloodlines</title>
  <meta name="description" content="Almost every thoroughbred racing today descends, father to son, from one of three stallions brought to England around 1700. Explore the family tree, follow any horse back to its founder, and see how two horses are related.">
  <meta property="og:title" content="Bloodlines">
  <meta property="og:description" content="The racehorse family tree, from three stallions to Secretariat, Frankel and Winx.">
  <meta property="og:image" content="https://junkdrawer.works/bloodlines/og.png">
  <meta property="og:url" content="https://junkdrawer.works/bloodlines/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131a17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <noscript><p class="noscript">Bloodlines needs JavaScript to draw the family tree.</p></noscript>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Bloodlines</h1>
        <p class="lede">Almost every racehorse alive descends, father to son, from one of three stallions brought to England around 1700.</p>
      </div>
      <div class="find" role="search">
        <label class="sr" for="q">Find a horse</label>
        <input id="q" type="search" placeholder="Find a horse" autocomplete="off" autocapitalize="words" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <ul id="suggest" role="listbox" aria-label="Matching horses" hidden></ul>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="chart" role="img" aria-label="A round family tree. The three founding stallions sit near the centre and each line runs from a father to a son, outward through time to horses foaled in the 2020s. Use the search box or the panel to explore it."></canvas>
      <ul class="legend" id="legend" aria-label="Colours"></ul>
      <div class="zoom" aria-label="Zoom">
        <button type="button" data-act="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" data-act="zoom-out" aria-label="Zoom out">&minus;</button>
        <button type="button" data-act="zoom-fit" aria-label="Show the whole tree">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="hint" id="hint"><span class="mouse">Drag to move. Scroll to zoom. Click a horse.</span><span class="touch">Pinch to zoom. Tap a horse.</span></p>
    </main>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
